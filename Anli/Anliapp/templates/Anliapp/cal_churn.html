<html>
    <head> 
    <title>Churn Rate Calculation</title>
    </head>
    <body>
        <h1 align="center">Churn Rate Calculator</h1>
        <h2 align="center">Anli Jovita (26008892)</h2>
        <form method="POST">
                {%csrf_token%}
                
            <lable>Initial Customer:</lable>

            <input type="number" value="{{churn_rate}}">
        </form>
    </body>
</html>
